name: Repository checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate experiment records
        shell: pwsh
        run: ./scripts/validate-experiment-lab.ps1

      - name: Validate English/Japanese Markdown parity
        shell: pwsh
        run: ./scripts/validate-documentation-parity.ps1

      - name: Validate reproducibility kit and workflow files
        shell: pwsh
        run: ./scripts/validate-reproducibility.ps1

      - name: Validate public simulator media fallbacks
        shell: pwsh
        run: ./scripts/validate-public-media.ps1

      - name: Set up Node.js for documentation build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build bilingual documentation site
        working-directory: docs
        run: |
          npm ci
          npm run docs:build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Check JSON files
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -File -Filter *.json |
            Where-Object { $_.Name -ne 'package-lock.json' -and $_.FullName -notmatch '[/\\](\.git|models|node_modules)[/\\]' } |
            ForEach-Object {
              try { Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json | Out-Null }
              catch { $errors += "$($_.FullName): $($_.Exception.Message)" }
            }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
