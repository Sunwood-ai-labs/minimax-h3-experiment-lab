<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniMax-H3 Ref2VA × FL2VA 比較 — X投稿シミュレーター</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e13;--panel:#121722;--panel2:#171d2a;--line:#273143;--text:#f2f4f8;--muted:#9da8b8;--blue:#5aa8ff;--green:#6ee7a3;--orange:#ffb45c;--red:#ff7d88;--shadow:0 18px 48px #0007}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 12% -10%,#1f3350 0,#0b0e13 35%),var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    a{color:var(--blue);overflow-wrap:anywhere}.shell{max-width:1320px;margin:0 auto;padding:28px 20px 56px}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.title{font-size:clamp(24px,3vw,40px);line-height:1.2;margin:5px 0 8px}.subtitle{margin:0;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #356548;background:#113221;color:var(--green);border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
    .toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.chip{border:1px solid var(--line);background:#111722;border-radius:9px;padding:7px 11px;color:#c8d1df;font-size:12px}.chip strong{color:var(--text)}
    .layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(310px,.7fr);gap:22px;align-items:start}.thread,.review{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.thread{padding:19px}.review{padding:19px;position:sticky;top:16px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;font-size:16px}.section-title small{color:var(--muted);font-weight:500}.post{position:relative;border:1px solid var(--line);background:linear-gradient(145deg,#151b27,#10151e);border-radius:16px;padding:16px;margin:0 0 14px}.post:last-child{margin-bottom:0}.post.reply{margin-left:30px}.post.reply:before{content:"";position:absolute;left:-18px;top:-15px;height:calc(100% + 15px);border-left:2px solid #34445c}.post.reply:after{content:"";position:absolute;left:-18px;top:24px;width:18px;border-top:2px solid #34445c}.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.post-label{font-weight:800}.post-kind{font-size:11px;color:var(--blue);border:1px solid #29466a;border-radius:5px;padding:2px 6px}.post-text{white-space:pre-wrap;margin:0;color:#e8edf5}.post-text a{color:#73b6ff;text-decoration:underline}.count{margin-top:10px;color:var(--muted);font-size:11px}.media-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:15px}.media-card{overflow:hidden;border:1px solid #2b384d;border-radius:12px;background:#0b1018}.media-card video{display:block;width:100%;height:auto;aspect-ratio:auto;background:#06080c;object-fit:contain}.media-info{padding:10px}.media-label{font-weight:800;font-size:13px}.media-stack{color:var(--blue);font-size:12px;margin-top:2px}.media-meta{color:var(--muted);font-size:11px;margin-top:4px}.media-source{color:#77869a;font-size:10px;margin-top:8px;word-break:break-all}.checklist{display:grid;gap:9px}.check{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-radius:10px;background:#0e141d;border:1px solid #202b3b;font-size:13px}.check.ok{border-color:#245a42}.check.warn{border-color:#694b25}.icon{width:20px;height:20px;display:inline-grid;place-items:center;flex:0 0 auto;border-radius:50%;font-size:12px;font-weight:800}.ok .icon{background:#174c35;color:var(--green)}.warn .icon{background:#553b1c;color:var(--orange)}.review h3{font-size:14px;margin:21px 0 10px}.review h3:first-child{margin-top:0}.metric{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #202938;font-size:13px}.metric:last-child{border-bottom:0}.metric span:last-child{font-weight:800;color:var(--green)}.footnote{color:var(--muted);font-size:12px;margin:20px 3px 0}.loading,.error{padding:30px;color:var(--muted)}
    @media (max-width:900px){.layout{grid-template-columns:1fr}.review{position:static}.topbar{align-items:flex-start}.post.reply{margin-left:20px}}
    @media (max-width:600px){.shell{padding:18px 12px 35px}.topbar{display:block}.badge{margin-top:14px}.thread,.review{padding:13px;border-radius:14px}.post{padding:13px;border-radius:13px}.post.reply{margin-left:12px}.post.reply:before,.post.reply:after{display:none}.media-grid{grid-template-columns:1fr}.title{font-size:26px}.toolbar{gap:6px}.chip{font-size:11px;padding:6px 8px}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="loading">シミュレーション payload を読み込み中…</div></main>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const linkify = value => esc(value).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');
    const byId = (items, id) => items.find(item => item.id === id);
    fetch('payload.json').then(response => { if (!response.ok) throw new Error('payload.json が読み込めません'); return response.json(); }).then(data => {
      const sim = data.simulation, media = data.media;
      const mediaCard = item => `<article class="media-card"><video controls preload="metadata"${item.poster ? ` poster="${esc(item.poster)}"` : ''} src="${esc(item.file)}"></video><div class="media-info"><div class="media-label">${esc(item.label)}</div><div class="media-stack">${esc(item.stack)}</div><div class="media-meta">${esc(item.dimensions)}<br>${esc(item.streams)}<br>Prompt: ${esc(item.promptId)}</div><div class="media-source">元ファイル: ${esc(item.source)}<br>検証値は公開manifestに保存</div></div></article>`;
      const postCard = post => { const attached = (post.media || []).map(id => byId(media,id)).filter(Boolean); return `<article class="post ${post.kind === 'reply' ? 'reply' : ''}"><div class="post-head"><span class="post-label">${esc(post.label)}</span><span class="post-kind">${post.kind === 'main' ? 'MAIN' : 'REPLY'}</span></div><p class="post-text">${linkify(post.text)}</p><div class="count">${post.text.length.toLocaleString('ja-JP')} 文字${attached.length ? ` ・ 動画 ${attached.length}本` : ''}</div>${attached.length ? `<div class="media-grid">${attached.map(mediaCard).join('')}</div>` : ''}</article>`; };
      const sourceHtml = data.sources.map(source => '<div class="check"><span class="icon">↗</span><span><strong>' + esc(source.label) + '</strong><br><small>' + esc(source.kind) + '</small><br><a href="' + esc(source.url) + '" target="_blank" rel="noreferrer">' + esc(source.url) + '</a></span></div>').join('');
      const variantHtml = (data.previewVariants || []).map(mediaCard).join('');
      const posted = sim.status === 'posted';
      document.getElementById('app').innerHTML = `<div class="topbar"><div><div class="eyebrow">X POST SIMULATOR / BUILD IN PUBLIC</div><h1 class="title">${esc(sim.title)}</h1><p class="subtitle">${esc(sim.note)}</p></div><div class="badge"><span class="dot"></span>${posted ? '投稿済み・確認済み' : '投稿前・未送信'}</div></div><div class="toolbar"><div class="chip">宛先 <strong>${esc(sim.targetAccount)}</strong></div><div class="chip">モード <strong>${esc(sim.mode)}</strong></div><div class="chip">投稿数 <strong>${sim.postCount}ポスト</strong></div><div class="chip">接続 <strong>linear ${sim.postCount}ポスト</strong></div></div><div class="layout"><section class="thread"><h2 class="section-title">投稿シミュレーション <small>添付順・返信順を固定表示</small></h2>${data.posts.map(postCard).join('')}<p class="footnote">※ ${posted ? `実投稿済み。メイン投稿: <a href="${esc(sim.publicThread)}" target="_blank" rel="noreferrer">${esc(sim.publicThread)}</a>` : 'この画面はシミュレーションです。Xへの送信は行っていません。'}</p></section><aside class="review"><h2 class="section-title">公開前レビュー <small>visual simulation</small></h2><div class="checklist"><div class="check warn"><span class="icon">!</span><span>主投稿は横幅ぴったりの1280×1408縦長動画。Xのlandscape preflightは未通過のため、視覚確認用シミュレーションとして表示。</span></div><div class="check ok"><span class="icon">✓</span><span>上Ref2VA / 下FL2VA。実験生成物から作ったevidence-derived tile。</span></div><div class="check ok"><span class="icon">✓</span><span>主投稿・Ref2VA・FL2VAの3ポストすべてに動画を添付。本文は改行なし。</span></div><div class="check ok"><span class="icon">✓</span><span>詳細URLは各動画返信の実験manifestに集約。</span></div><div class="check ok"><span class="icon">✓</span><span>実験フォルダはGitHubのorigin/mainへ公開済み。README・全文prompt・参照PNG・workflow・manifestを辿れる。</span></div></div><h3>比較メトリクス</h3><div class="metric"><span>Ref2VA ComfyUI実行</span><span>898.216秒</span></div><div class="metric"><span>FL2VA ComfyUI実行</span><span>980.446秒</span></div><div class="metric"><span>OOM / 黒画検出</span><span>なし / なし</span></div><h3>参照・公式ソース</h3><div class="checklist">${sourceHtml}</div>${variantHtml ? `<h3>X preflight通過版（比較プレビュー）</h3><div class="media-grid">${variantHtml}</div>` : ''}<h3>公開証跡</h3><div class="checklist"><div class="check"><span class="icon">i</span><span>${esc(data.evidence.experiment)}</span></div><div class="check"><span class="icon">i</span><span>${esc(data.evidence.manifest)}</span></div></div></aside></div>`;
    }).catch(error => { document.getElementById('app').innerHTML = `<div class="error">${esc(error.message)}</div>`; });
  </script>
  <script>
    const reviewObserver = new MutationObserver(() => {
      const item = [...document.querySelectorAll('.review .check')].find(node => node.textContent.includes('主投稿・Ref2VA・FL2VA'));
      if (!item) return;
      const label = item.querySelector('span:last-child');
      if (label) label.textContent = '主投稿・Ref2VA・FL2VAの3ポストすべてに動画を添付。本文は改行なし。';
      reviewObserver.disconnect();
    });
    reviewObserver.observe(document.getElementById('app'), {childList: true, subtree: true});
  </script>
</body>
</html>
